name: Full sweep

on:
  schedule:
    - cron: "17 4 * * *"   # daily; watch.yml handles the frequent path
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Also re-probe companies with no ATS resolved yet"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-write        # shared with watch.yml
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Re-probe unresolved companies
        if: inputs.rediscover
        run: python scripts/discover_ats.py --recheck-unknown --workers 12

      - name: Fetch listings
        run: python scripts/fetch_listings.py --workers 8

      - name: Build README
        run: python scripts/build_readme.py

      - name: Commit if anything moved
        run: |
          git config user.name  "f500-swe-radar"
          git config user.email "actions@users.noreply.github.com"
          git add -A data README.md
          if git diff --cached --quiet; then
            echo "no change"
          else
            n=$(python -c "import json;print(json.load(open('data/listings.json'))['count'])")
            git commit -m "refresh: $n open postings"
            # A run holds its checkout for minutes while it fetches, so anything
            # pushed meanwhile -- another workflow, or a laptop -- makes this
            # push a non-fast-forward. Replay onto whatever landed and retry.
            # These files are regenerated artifacts, so on conflict this run's
            # freshly fetched version wins.
            for attempt in 1 2 3; do
              git fetch -q origin main
              git rebase -X theirs origin/main >/dev/null 2>&1 || { git rebase --abort >/dev/null 2>&1; }
              if git push -q; then echo "pushed on attempt $attempt"; break; fi
              [ "$attempt" = 3 ] && { echo "could not push after 3 attempts"; exit 1; }
              sleep 5
            done
          fi
