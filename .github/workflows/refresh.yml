name: Refresh radar

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours, off the hour to avoid the stampede
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Also re-probe companies with no ATS resolved yet"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Re-probe unresolved companies
        if: inputs.rediscover
        run: python scripts/discover_ats.py --recheck-unknown --workers 12

      - name: Fetch listings
        run: python scripts/fetch_listings.py --workers 8

      - name: Build README
        run: python scripts/build_readme.py

      - name: Commit if anything moved
        run: |
          git config user.name  "f500-swe-radar"
          git config user.email "actions@users.noreply.github.com"
          git add -A data README.md
          if git diff --cached --quiet; then
            echo "no change"
          else
            n=$(python -c "import json;print(json.load(open('data/listings.json'))['count'])")
            git commit -m "refresh: $n open postings"
            git push
          fi
