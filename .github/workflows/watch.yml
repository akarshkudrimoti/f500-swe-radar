name: Watch for changes

# Cheap change detection. One request per board tells us whether it moved
# (~60s for all of them); only the boards that actually moved get the
# expensive paginated fetch. Most of the cost of "check more often" disappears.
#
# CADENCE. A run is ~1 min when nothing changed and ~3 min when something did.
# This repository is public, so Actions minutes are unmetered and the interval
# is set by what is polite and useful rather than by billing.
#
# Fifteen minutes is the floor worth having: GitHub's own cron minimum is five,
# schedules fire late under load, and job boards report posting age in days --
# so probing faster would add load without surfacing anything sooner.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Refetch every board, ignoring the signatures"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar-write        # shared with refresh.yml; these must not interleave
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests

      - name: Probe every board for change
        id: probe
        run: |
          set +e
          changed=$(python scripts/watch.py --workers 16)
          code=$?
          set -e
          if [ "${{ inputs.force_all }}" = "true" ]; then
            changed="__ALL__"; code=0
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Names can be long; pass them through a file, not an output.
          printf '%s' "$changed" > /tmp/changed.txt
          echo "count=$(tr ',' '\n' < /tmp/changed.txt | grep -c . || true)" >> "$GITHUB_OUTPUT"

      - name: Refetch only what moved
        if: steps.probe.outputs.code == '0'
        run: |
          changed=$(cat /tmp/changed.txt)
          if [ "$changed" = "__ALL__" ]; then
            echo "no baseline yet (or forced) - full fetch"
            python scripts/fetch_listings.py --workers 8
          else
            echo "refetching: $changed"
            python scripts/fetch_listings.py --companies "$changed" --workers 8
          fi
          python scripts/build_readme.py

      - name: Commit if anything moved
        if: steps.probe.outputs.code == '0'
        run: |
          git config user.name  "f500-swe-radar"
          git config user.email "actions@users.noreply.github.com"
          git add -A data README.md
          if git diff --cached --quiet; then
            echo "boards moved but no posting we track changed"
          else
            n=$(python -c "import json;print(json.load(open('data/listings.json'))['count'])")
            git commit -m "watch: $n open postings (${{ steps.probe.outputs.count }} boards moved)"
            git push
          fi

      - name: Nothing changed
        if: steps.probe.outputs.code != '0'
        run: echo "no board moved since the last check"
